
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kristel AI 💗</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;
  background:#fff4f9;color:#49313f;
}
header{
  background:linear-gradient(135deg,#ff80b5,#e84f91);
  color:white;text-align:center;padding:25px 15px;
}
header h1{margin:0 0 8px}
header p{margin:0}
main{
  max-width:650px;margin:25px auto;padding:15px;
}
#chat{
  background:white;border-radius:20px;padding:18px;
  min-height:300px;box-shadow:0 5px 20px #e9bfd0;
}
.message{
  padding:12px 15px;border-radius:16px;
  margin:10px 0;max-width:90%;line-height:1.5;
  overflow-wrap:anywhere;
}
.bot{background:#ffe3ef;margin-right:auto}
.user{background:#ed6ca4;color:white;margin-left:auto}
form{display:flex;gap:8px;margin-top:15px}
input{
  flex:1;min-width:0;padding:14px;border:2px solid #f3b4ce;
  border-radius:14px;font-size:16px;
}
button{
  border:0;border-radius:14px;padding:12px 17px;
  background:#e84f91;color:white;font-size:16px;
  cursor:pointer;
}
button:disabled{opacity:.6}
.note{text-align:center;font-size:13px;color:#826777}
</style>
</head>
<body>
<header>
  <h1>💗 Kristel AI</h1>
  <p>Jouw hulpje bij cash stuffing en sparen!</p>
</header>
<main>
  <div id="chat" aria-live="polite">
    <div class="message bot">
      Hoi! 💕 Ik ben Kristel AI. Waarmee kan ik je helpen?
      Je kunt me vragen stellen over cash stuffing, budgetteren
      en spaardoelen.
    </div>
  </div>
  <form id="form">
    <input id="vraag" placeholder="Typ je vraag..." required>
    <button id="send" type="submit">Stuur</button>
  </form>
  <p class="note" id="status">
    De AI-verbinding moet nog veilig worden ingesteld.
  </p>
</main>
<script>
const form = document.getElementById("form");
const vraag = document.getElementById("vraag");
const chat = document.getElementById("chat");
const send = document.getElementById("send");
const statusTekst = document.getElementById("status");

function bericht(tekst, soort) {
  const div = document.createElement("div");
  div.className = "message " + soort;
  div.textContent = tekst;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();
  const tekst = vraag.value.trim();
  if (!tekst) return;

  bericht(tekst, "user");
  vraag.value = "";
  send.disabled = true;
  statusTekst.textContent = "Even wachten...";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: tekst})
    });

    if (!response.ok) throw new Error("AI niet verbonden");

    const data = await response.json();
    if (!data.reply) throw new Error("Geen antwoord ontvangen");
    bericht(data.reply, "bot");
    statusTekst.textContent = "Verbonden met Kristel AI 💗";
  } catch (error) {
    bericht(
      "Ik ben nog niet verbonden met de echte AI. 💗 " +
      "De veilige AI-verbinding moet eerst worden ingesteld.",
      "bot"
    );
    statusTekst.textContent = "De AI-verbinding wordt nog ingesteld.";
  } finally {
    send.disabled = false;
    vraag.focus();
  }
});
</script>
</body>
</html>
